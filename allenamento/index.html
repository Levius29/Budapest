<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Allenamento">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="Programma di 8 settimane: pesi Upper/Lower, cardio, progressione, monitoraggio.">
<title>Allenamento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#0b0d10; --s1:#13161b; --s2:#1a1e24; --s3:#232830; --line:#2a3038;
  --tx:#eef1f4; --mu:#8d97a3; --dim:#5d6672;
  --acc:#c8f04a; --acc-ink:#11140a;
  --main:#ff8a3d; --comp:#5ab0ff; --iso:#b48cff;
  --ok:#3ddc84; --warn:#ffd23f; --bad:#ff5c5c;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --r:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
b,.num{font-variant-numeric:tabular-nums}
h2{font-size:24px;line-height:1.15;letter-spacing:-.4px}
h3{font-size:17px;line-height:1.25;letter-spacing:-.2px}
.muted{color:var(--mu)}
small{font-size:12px}

/* header */
.top{position:sticky;top:0;z-index:20;padding:calc(var(--st) + 8px) 16px 10px;background:rgba(11,13,16,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--acc);flex:1;min-width:0}
.week{display:flex;align-items:center;background:var(--s2);border-radius:999px;padding:3px}
.week button{width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--mu)}
.week button:active{background:var(--s3)}
.week button:disabled{opacity:.25}
.wk{min-width:92px;text-align:center;line-height:1.1}
.wk b{display:block;font-size:15px}
.wk small{color:var(--mu);font-size:11px}
.wake{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--mu)}
.wake.on{background:var(--acc);color:var(--acc-ink)}
.wake svg{width:20px;height:20px}

main{padding:16px 16px calc(var(--sb) + 150px);max-width:640px;margin:0 auto}
section+section{margin-top:28px}
.sec-t{font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);margin:0 2px 10px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}

/* segment giorni */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.seg button{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:8px 4px;line-height:1.15;min-height:52px}
.seg button b{display:block;font-size:16px}
.seg button small{color:var(--mu);font-size:11px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.seg button.on small{color:var(--acc-ink);opacity:.75}
.dayhead{margin-bottom:14px}
.dayhead p{margin-top:2px}

.banner{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px;background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.35);color:#ffe69a}
.banner.info{background:rgba(200,240,74,.08);border-color:rgba(200,240,74,.3);color:#e2f7a8}

/* fasi */
.phases{list-style:none}
.phases li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.phases li:last-child{border-bottom:0}
.phases li span{font-size:15px}
.phases li small{grid-column:1/-1;color:var(--mu);font-size:13px}
.phases li b{font-size:15px}
.phases li.tot{padding-top:11px}
.phases li.tot span,.phases li.tot b{font-weight:700;color:var(--acc)}

/* esercizi */
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.ex::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--line))}
.ex.main{--c:var(--main)} .ex.comp{--c:var(--comp)} .ex.iso{--c:var(--iso)}
.ex+.ex,.ss+.ex,.ex+.ss,.ss+.ss{margin-top:10px}
.ex-h{display:flex;gap:12px;align-items:flex-start}
.ord{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:var(--s3);display:grid;place-items:center;font-weight:700;font-size:15px}
.ex-h h3{margin-top:1px}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.3px;padding:2px 8px;border-radius:999px;margin-top:4px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.cell{background:var(--s2);border-radius:10px;padding:7px 8px;text-align:left;min-height:52px}
.cell small{display:block;color:var(--mu);font-size:11px;line-height:1.2}
.cell b{display:block;font-size:17px;margin-top:2px;white-space:nowrap}
.cell.rec{background:color-mix(in srgb,var(--acc) 14%,var(--s2));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.cell.rec b{color:var(--acc)}
.cell.rec:active{transform:scale(.97)}
.cell .play{font-size:11px;vertical-align:2px}
.note{font-size:14px;color:#c9d0d8}
.int{font-size:13.5px;margin-top:8px;padding:7px 10px;border-radius:10px;background:rgba(255,138,61,.1);color:#ffc49c}
.int.off{background:var(--s2);color:var(--dim);text-decoration:line-through}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{list-style:none;font-size:14px;color:var(--mu);display:flex;justify-content:space-between;align-items:center;min-height:32px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--dim)}
details[open] summary::after{content:"−"}
.det{font-size:14px;display:grid;gap:8px;padding:4px 0 2px}
.det dt{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.det dd{margin-top:1px}
.ss{border:1px dashed color-mix(in srgb,var(--iso) 55%,transparent);border-radius:20px;padding:8px}
.ss-l{font-size:12px;font-weight:600;color:var(--iso);letter-spacing:.6px;text-transform:uppercase;padding:2px 6px 8px}
.ss .ex+.ex{margin-top:8px}

.link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--acc);font-weight:600;font-size:15px;min-height:36px}

/* tabelle */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:6px 6px 8px}
.tbl td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr.cur td{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.tbl tr.cur td:first-child{box-shadow:inset 3px 0 var(--acc)}
.tbl tr[data-week]{cursor:pointer}
.tbl .r{text-align:right}
.tbl.tight{font-size:13px}
.tbl.tight td,.tbl.tight th{padding-left:4px;padding-right:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--s3);color:var(--mu)}
.tag.hiit{background:rgba(255,92,92,.15);color:#ff9a9a}
.tag.z2{background:rgba(90,176,255,.13);color:#9fd0ff}

/* cardio */
.cd{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.cd .ord{background:var(--s2)}
.cd .min{font-size:22px;font-weight:700}
.cd .min small{font-size:13px;color:var(--mu);font-weight:500}
.cd p{grid-column:1/-1;font-size:14px;color:#c9d0d8}
.cd p.muted{color:var(--mu);font-size:13px}
.cd.today{border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.zone{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.zone p{grid-column:1/-1;font-size:14px;color:var(--mu)}

/* hiit */
.hiit{text-align:center;padding:18px 14px}
.hiit .ph{font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mu)}
.hiit .big{font-size:72px;font-weight:700;line-height:1;margin:6px 0 4px;letter-spacing:-2px}
.hiit.lavoro .ph,.hiit.lavoro .big{color:var(--bad)}
.hiit.recupero .ph,.hiit.recupero .big{color:var(--comp)}
.hiit.risc .big,.hiit.z2 .big{color:var(--tx)}
.hiit .sub{font-size:13px;color:var(--mu)}
.prog{height:6px;background:var(--s3);border-radius:999px;overflow:hidden;margin:14px 0}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s linear}
.btns{display:flex;gap:8px;justify-content:center}
.btn{min-height:48px;padding:0 20px;border-radius:14px;background:var(--s3);font-weight:600;font-size:16px}
.btn.pri{background:var(--acc);color:var(--acc-ink);flex:1;max-width:220px}
.btn:active{transform:scale(.97)}

/* volume */
.vol{display:grid;grid-template-columns:1fr 46px;gap:4px 10px;align-items:center;font-size:14px}
.vol .bar{grid-column:1/-1;height:6px;border-radius:999px;background:var(--s3);overflow:hidden;margin-bottom:8px;display:flex}
.vol .bar i{display:block;height:100%;background:var(--acc)}
.vol .bar i+i{background:color-mix(in srgb,var(--acc) 40%,var(--s3))}
.vol b{text-align:right}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:10px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--acc)}
.leg span+span::before{background:color-mix(in srgb,var(--acc) 40%,var(--s3))}

/* liste */
.list{list-style:none;display:grid;gap:10px;font-size:15px}
.list li{padding-left:18px;position:relative}
.list li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--acc)}
ol.steps{list-style:none;counter-reset:s;display:grid;gap:12px;font-size:15px}
ol.steps li{counter-increment:s;padding-left:34px;position:relative}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:8px;background:var(--s3);display:grid;place-items:center;font-size:13px;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--s2);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--mu);font-size:11px}
.kv b{font-size:15px}
.sem{border-left:4px solid var(--c)}
.sem.verde{--c:var(--ok)} .sem.giallo{--c:var(--warn)} .sem.rosso{--c:var(--bad)}
.sem h3{color:var(--c)}
.sem p{font-size:14px;margin-top:4px}
.sem p.muted{color:var(--mu)}
.mon{display:grid;gap:2px}
.mon+.mon{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.mon div{display:flex;justify-content:space-between;gap:10px}
.mon p{font-size:14px;color:var(--mu)}
.g h3{margin-bottom:6px}
.g p{font-size:15px;color:#c9d0d8}
.g p+p{margin-top:6px}
pre{white-space:pre-wrap;font:13.5px/1.55 ui-monospace,"SF Mono",Menlo,monospace;background:var(--s2);border-radius:12px;padding:12px;color:#d5dbe2;user-select:text;-webkit-user-select:text}

/* timer recupero */
.timer{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 72px);z-index:30;max-width:620px;margin:0 auto;background:#1d2229;border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden}
.timer[hidden]{display:none}
.timer .ti{flex:1;min-width:0}
.timer .ti small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .ti b{font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-1px}
.timer button{min-width:48px;height:48px;border-radius:12px;background:var(--s3);font-weight:600}
.timer .tb{position:absolute;left:0;right:0;bottom:0;height:3px}
.timer .tb i{display:block;height:100%;width:0;background:var(--acc)}
.timer.done{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.timer.done small{color:var(--acc-ink)}
.timer.done button{background:rgba(0,0,0,.12)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(var(--sb) + 6px);background:rgba(11,13,16,.9);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:600;min-height:52px}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--acc)}

body.flash::after{content:"";position:fixed;inset:0;background:var(--acc);opacity:.35;pointer-events:none;z-index:99;animation:fl .9s ease-out forwards}
@keyframes fl{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Allenamento</div>
  <div class="week" aria-label="Settimana">
    <button id="wk-prev" aria-label="Settimana precedente">‹</button>
    <div class="wk"><b id="wk-n">Sett. 1</b><small id="wk-f">Introduzione</small></div>
    <button id="wk-next" aria-label="Settimana successiva">›</button>
  </div>
  <button class="wake" id="wake" hidden aria-label="Schermo sempre acceso" title="Schermo sempre acceso">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main id="view"></main>

<div class="timer" id="timer" hidden role="timer" aria-live="polite">
  <div class="ti"><small id="t-nome">Recupero</small><b id="t-tempo">0:00</b></div>
  <button data-t="-15" aria-label="Meno 15 secondi">−15</button>
  <button data-t="15" aria-label="Più 15 secondi">+15</button>
  <button data-t="x" aria-label="Chiudi timer">✕</button>
  <div class="tb"><i id="t-prog"></i></div>
</div>

<nav class="tabs" aria-label="Sezioni">
  <button data-tab="giorni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Giorni</button>
  <button data-tab="cardio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Cardio</button>
  <button data-tab="piano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Piano</button>
  <button data-tab="guida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Guida</button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
